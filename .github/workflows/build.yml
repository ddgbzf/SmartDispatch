name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APKs (banzu1 & banzu2)
      run: ./gradlew assembleRelease

    - name: Rename APKs
      run: |
        VERSION=${GITHUB_REF_NAME:-v1.0.0}
        mv app/build/outputs/apk/banzu1/release/app-banzu1-release.apk app/build/outputs/apk/banzu1/release/SmartDispatch-一班-${VERSION}.apk
        mv app/build/outputs/apk/banzu2/release/app-banzu2-release.apk app/build/outputs/apk/banzu2/release/SmartDispatch-二班-${VERSION}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          app/build/outputs/apk/banzu1/release/SmartDispatch-一班-*.apk
          app/build/outputs/apk/banzu2/release/SmartDispatch-二班-*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        name: SmartDispatch-APKs
        path: |
          app/build/outputs/apk/banzu1/release/SmartDispatch-一班-*.apk
          app/build/outputs/apk/banzu2/release/SmartDispatch-二班-*.apk
